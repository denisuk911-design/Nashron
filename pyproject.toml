[project]
name = "team2050"
version = "0.1.0"
description = "Windows desktop client for owner-managed teams of AI employees."
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
