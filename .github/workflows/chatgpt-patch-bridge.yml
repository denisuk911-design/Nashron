name: ChatGPT Patch Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply-patch:
    if: >
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[LUMINIFERA PATCH]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply requested files
        env:
          PATCH_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          from pathlib import Path

          body = os.environ["PATCH_BODY"]
          data = json.loads(body)

          files = data.get("files", [])
          if not files:
              raise SystemExit("No files supplied")

          forbidden = (
              ".git/",
              ".github/workflows/",
          )

          for item in files:
              rel = item["path"].replace("\\", "/").lstrip("/")

              if rel.startswith(forbidden):
                  raise SystemExit(f"Forbidden path: {rel}")

              path = Path(rel)

              if item.get("delete"):
                  if path.exists():
                      path.unlink()
                  continue

              encoded = item["content_b64"]
              content = base64.b64decode(encoded)

              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)

              print(f"updated: {rel}")
          PY

      - name: Commit and push
        run: |
          git config user.name "Luminifera Patch Bridge"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "fix: apply Luminifera patch #${{ github.event.issue.number }}"
          git push origin HEAD:main

      - name: Close patch issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "Patch applied to main."
          gh issue close ${{ github.event.issue.number }}
