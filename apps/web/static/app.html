<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luminifera</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/v2.css">
  <link rel="stylesheet" href="/assets/iris.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Luminifera"><span class="brand-mark">L</span><span><strong>Luminifera</strong><small>рабочее пространство</small></span></a>
    <nav class="main-nav" aria-label="Основная навигация">
      <button class="nav-link active" data-view="home">Главная</button><button class="nav-link" data-view="iris">Iris</button><button class="nav-link" data-view="team">Команда</button><button class="nav-link" data-view="work">Работа</button><button class="nav-link" data-view="files">Файлы</button><button class="nav-link" data-view="settings">Настройки</button>
    </nav>
    <div class="top-actions"><span class="presence-dot" aria-hidden="true"></span><span class="presence-label">Iris рядом</span><button class="profile-button" aria-label="Профиль владельца">В</button></div>
  </header>
  <main id="workspace" class="workspace">
    <aside class="workspace-sidebar"><label class="field-label" for="org-select">Рабочее пространство</label><select id="org-select"><option value="">Выберите организацию</option></select><button class="new-org" id="new-org">+ Новая организация</button><div class="side-nav" aria-label="Разделы"><button class="side-link active" data-view="home">Главная</button><button class="side-link" data-view="iris">Iris</button><button class="side-link" data-view="team">Команда</button><button class="side-link" data-view="work">Работа</button><button class="side-link" data-view="files">Файлы</button><button class="side-link" data-view="settings">Настройки</button></div><div class="sidebar-foot"><span class="owner-avatar">В</span><span><b>Владелец</b><small>личное пространство</small></span></div></aside>
    <section class="content" aria-live="polite"><div class="content-head"><div><span class="section-kicker">LUMINIFERA</span><h1 id="view-title">Главная</h1></div><button class="quiet-button" id="refresh">Обновить</button></div><div id="view"></div></section>
  </main>
  <dialog id="org-dialog"><form method="dialog" id="org-form"><button class="dialog-close" value="cancel" aria-label="Закрыть">×</button><span class="section-kicker">Новое пространство</span><h2>С чего начнём?</h2><p>Создайте организацию, чтобы Iris могла собрать рабочую команду.</p><label>Название<input id="org-name" required maxlength="160" placeholder="Например, Nova Lab"></label><label>Направление<textarea id="org-purpose" maxlength="2000" placeholder="Какой результат нужно получить?"></textarea></label><button class="primary" value="default">Создать пространство</button></form></dialog>
  <script src="/runtime-config.js"></script><script src="/assets/app.js" defer></script><script src="/assets/product-v2.js" defer></script>
</body>
</html>
